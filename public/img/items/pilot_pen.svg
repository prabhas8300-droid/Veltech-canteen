<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_pilot_pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e2b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_pilot_pen" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_pilot_pen)"/>
  
      <rect x="90" y="123" width="190" height="16" rx="5" fill="#1e293b" filter="url(#shadow_pilot_pen)"/>
      <!-- Ergonomic Rubber Grip -->
      <rect x="100" y="123" width="50" height="16" rx="3" fill="#2563eb"/>
      <!-- Ink Window -->
      <rect x="165" y="127" width="40" height="8" rx="2" fill="#60a5fa" opacity="0.75"/>
      <text x="235" y="134" font-family="sans-serif" font-size="7" font-weight="900" fill="#ffffff">PILOT G-2 05</text>
      <!-- Click plunger on back -->
      <rect x="280" y="126" width="20" height="10" rx="2" fill="#2563eb"/>
      <polygon points="90,126 90,136 74,131" fill="#cbd5e1"/>
    
  <rect x="16" y="16" width="54" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="43.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3b82f6" text-anchor="middle" letter-spacing="0.8">PENS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Pilot G2 0.5mm Retractable Gel Pen</text>
</svg>