<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_stapler_pins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13241b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_stapler_pins" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_stapler_pins)"/>
  
      <!-- Box of Staple Pins -->
      <rect x="120" y="85" width="160" height="95" rx="6" fill="#15803d" stroke="#fef08a" stroke-width="2" filter="url(#shadow_stapler_pins)"/>
      <rect x="125" y="90" width="150" height="85" rx="4" fill="#16a34a"/>
      <text x="200" y="125" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">STAPLE PINS</text>
      <text x="200" y="142" font-family="sans-serif" font-size="9" font-weight="800" fill="#fef08a" text-anchor="middle">No. 10 • 1000 PINS</text>
      <!-- Silver pin strip drawn -->
      <rect x="145" y="152" width="110" height="6" fill="#cbd5e1"/>
    
  <rect x="16" y="16" width="102" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#eab308" stroke-width="1.2"/>
  <text x="67.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#eab308" text-anchor="middle" letter-spacing="0.8">STATIONERY</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Steel Stapler Pins (Box of 1000)</text>
</svg>