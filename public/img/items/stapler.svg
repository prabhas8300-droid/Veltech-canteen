<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_stapler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171d29"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_stapler" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_stapler)"/>
  
      <!-- Heavy Duty Desktop Stapler -->
      <path d="M 120,165 L 260,165 L 255,145 L 140,145 Z" fill="#475569" filter="url(#shadow_stapler)"/>
      <path d="M 130,145 L 260,145 Q 275,145 265,125 L 150,110 Q 130,110 130,145 Z" fill="#2563eb" filter="url(#shadow_stapler)"/>
      <rect x="120" y="165" width="150" height="12" rx="2" fill="#1e293b"/>
      <circle cx="240" cy="132" r="6" fill="#cbd5e1"/>
      <text x="200" y="132" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#ffffff">NO.10 STAPLER</text>
    
  <rect x="16" y="16" width="102" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#eab308" stroke-width="1.2"/>
  <text x="67.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#eab308" text-anchor="middle" letter-spacing="0.8">STATIONERY</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Desktop Metal Stapler (No. 10)</text>
</svg>