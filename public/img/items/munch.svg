<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_munch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16261a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_munch" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_munch)"/>
  
      <!-- Green Vibrant Wrapper -->
      <rect x="110" y="80" width="180" height="105" rx="8" fill="#15803d" filter="url(#shadow_munch)"/>
      <rect x="115" y="85" width="170" height="95" rx="6" fill="#16a34a"/>
      <!-- Orange &amp; Yellow Burst -->
      <polygon points="120,85 280,85 260,180 140,180" fill="#facc15"/>
      <text x="200" y="112" font-family="sans-serif" font-size="10" font-weight="800" fill="#991b1b" text-anchor="middle">Nestle</text>
      <text x="200" y="148" font-family="Impact, sans-serif" font-size="34" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1.5">MUNCH</text>
      <text x="200" y="168" font-family="sans-serif" font-size="9" font-weight="900" fill="#15803d" text-anchor="middle">CRUNCH COATED WAFER</text>
    
  <rect x="16" y="16" width="94" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#22c55e" stroke-width="1.2"/>
  <text x="63.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="0.8">CHOCOLATE</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Nestle Munch Crunchy Wafer Bar</text>
</svg>