<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_clear_folder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15202b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_clear_folder" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_clear_folder)"/>
  
      <!-- Transparent Document Sleeve -->
      <rect x="130" y="50" width="140" height="165" rx="4" fill="#ffffff" opacity="0.65" stroke="#38bdf8" stroke-width="2" filter="url(#shadow_clear_folder)"/>
      <!-- Sheet of paper inside -->
      <rect x="138" y="58" width="124" height="149" fill="#f8fafc"/>
      <line x1="150" y1="80" x2="245" y2="80" stroke="#cbd5e1" stroke-width="3"/>
      <line x1="150" y1="100" x2="245" y2="100" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="150" y1="120" x2="245" y2="120" stroke="#cbd5e1" stroke-width="2"/>
      <text x="200" y="155" font-family="sans-serif" font-size="9" font-weight="800" fill="#0284c7" text-anchor="middle">L-FOLDER (5 PCS)</text>
    
  <rect x="16" y="16" width="62" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="47.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0ea5e9" text-anchor="middle" letter-spacing="0.8">FILES</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Clear L-Type Plastic Folder (Pack of 5)</text>
</svg>