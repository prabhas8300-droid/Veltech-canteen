<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_veg_fried_rice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2019"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_veg_fried_rice" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_veg_fried_rice)"/>
  
      <ellipse cx="200" cy="140" rx="130" ry="75" fill="#18181b" filter="url(#shadow_veg_fried_rice)"/>
      <ellipse cx="200" cy="135" rx="118" ry="65" fill="#27272a"/>
      <!-- Fried Rice Bed -->
      <ellipse cx="200" cy="130" rx="105" ry="55" fill="#fef9c3"/>
      <!-- Veggie bits -->
      <circle cx="160" cy="120" r="3.5" fill="#ea580c"/>
      <circle cx="180" cy="140" r="3" fill="#16a34a"/>
      <circle cx="210" cy="115" r="3.5" fill="#16a34a"/>
      <circle cx="235" cy="135" r="3.5" fill="#ea580c"/>
      <circle cx="195" cy="125" r="3" fill="#ea580c"/>
      <circle cx="150" cy="138" r="3" fill="#16a34a"/>
      <circle cx="220" cy="142" r="3" fill="#16a34a"/>
      <!-- Chopsticks -->
      <line x1="120" y1="65" x2="280" y2="175" stroke="#a16207" stroke-width="4" stroke-linecap="round"/>
      <line x1="140" y1="60" x2="295" y2="170" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
    
  <rect x="16" y="16" width="110" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#22c55e" stroke-width="1.2"/>
  <text x="71.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="0.8">LUNCH • VEG</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Wok Veg Fried Rice</text>
</svg>