<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_maths_book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_maths_book" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_maths_book)"/>
  
          <!-- Book Spine &amp; Cover 3D angle -->
          <rect x="135" y="45" width="140" height="175" rx="6" fill="#1e3a8a" filter="url(#shadow_maths_book)"/>
          <rect x="140" y="50" width="130" height="165" rx="4" fill="#2563eb"/>
          <!-- White spine band -->
          <rect x="135" y="45" width="16" height="175" rx="3" fill="#1e293b"/>
          <rect x="155" y="65" width="105" height="75" rx="4" fill="#ffffff" opacity="0.95"/>
          <text x="207" y="85" font-family="sans-serif" font-size="9.5" font-weight="900" fill="#0f172a" text-anchor="middle">ENGINEERING MATHEM</text>
          <text x="207" y="100" font-family="sans-serif" font-size="8" font-weight="800" fill="#2563eb" text-anchor="middle">ATICS VOL.1</text>
          <!-- Academic Emblem -->
          <circle cx="207" cy="122" r="10" fill="#e2e8f0"/>
          <text x="207" y="126" font-size="11" text-anchor="middle">🎓</text>
          <text x="207" y="175" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">VEL TECH SYLLABUS</text>
          <text x="207" y="195" font-family="sans-serif" font-size="7" font-weight="600" fill="#94a3b8" text-anchor="middle">Standard Edition</text>
        
  <rect x="16" y="16" width="150" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="91.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3b82f6" text-anchor="middle" letter-spacing="0.8">BOOKS • TEXTBOOK</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Higher Engineering Mathematics</text>
</svg>