<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_putty_eraser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e25"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_putty_eraser" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_putty_eraser)"/>
  
      <!-- Kneaded grey dough block with sculpted impression -->
      <rect x="135" y="90" width="130" height="80" rx="8" fill="#64748b" filter="url(#shadow_putty_eraser)"/>
      <path d="M 140,110 C 170,95 230,120 260,105 L 260,165 L 140,165 Z" fill="#475569" opacity="0.6"/>
      <text x="200" y="138" font-family="sans-serif" font-size="10" font-weight="800" fill="#f8fafc" text-anchor="middle">KNEADED ART PUTTY</text>
    
  <rect x="16" y="16" width="78" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="55.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#14b8a6" text-anchor="middle" letter-spacing="0.8">ERASERS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Artist Kneaded Putty Eraser</text>
</svg>