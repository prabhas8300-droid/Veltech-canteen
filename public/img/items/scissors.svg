<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_scissors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#251b14"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_scissors" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_scissors)"/>
  
      <!-- Twin Steel Blades Crossing -->
      <path d="M 160,135 L 260,75 L 255,70 L 150,130 Z" fill="#e2e8f0" filter="url(#shadow_scissors)"/>
      <path d="M 160,135 L 260,175 L 255,180 L 150,138 Z" fill="#cbd5e1" filter="url(#shadow_scissors)"/>
      <!-- Pivot Screw -->
      <circle cx="160" cy="135" r="5" fill="#475569"/>
      <!-- Ergonomic Finger Loops (Orange/Black) -->
      <ellipse cx="120" cy="115" rx="24" ry="16" fill="none" stroke="#ea580c" stroke-width="10" transform="rotate(-25 120 115)"/>
      <ellipse cx="120" cy="155" rx="24" ry="16" fill="none" stroke="#ea580c" stroke-width="10" transform="rotate(25 120 155)"/>
    
  <rect x="16" y="16" width="102" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#eab308" stroke-width="1.2"/>
  <text x="67.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#eab308" text-anchor="middle" letter-spacing="0.8">STATIONERY</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Stainless Steel Paper Scissors</text>
</svg>