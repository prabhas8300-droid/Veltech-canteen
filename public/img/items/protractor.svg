<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_protractor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_protractor" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_protractor)"/>
  
      <!-- 180 Degree Half Circle -->
      <path d="M 90,170 A 110 110 0 0 1 310,170 Z" fill="#ffffff" opacity="0.75" stroke="#2563eb" stroke-width="2" filter="url(#shadow_protractor)"/>
      <path d="M 140,170 A 60 60 0 0 1 260,170 Z" fill="#18181b"/>
      <!-- Angle lines &amp; Center guide -->
      <circle cx="200" cy="170" r="4" fill="#2563eb"/>
      <line x1="200" y1="170" x2="200" y2="65" stroke="#2563eb" stroke-width="1.5"/>
      <text x="200" y="80" font-family="sans-serif" font-size="8" font-weight="800" fill="#1e293b" text-anchor="middle">90°</text>
      <text x="110" y="165" font-family="sans-serif" font-size="8" font-weight="800" fill="#1e293b">0°</text>
      <text x="290" y="165" font-family="sans-serif" font-size="8" font-weight="800" fill="#1e293b">180°</text>
    
  <rect x="16" y="16" width="70" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="51.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#8b5cf6" text-anchor="middle" letter-spacing="0.8">RULERS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">180 Degree Precision Protractor</text>
</svg>