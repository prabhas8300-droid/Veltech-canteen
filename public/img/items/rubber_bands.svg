<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_rubber_bands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241f17"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_rubber_bands" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_rubber_bands)"/>
  
      <!-- Elastic Loops -->
      <ellipse cx="170" cy="130" rx="55" ry="32" fill="none" stroke="#eab308" stroke-width="6" transform="rotate(-20 170 130)" filter="url(#shadow_rubber_bands)"/>
      <ellipse cx="230" cy="135" rx="50" ry="28" fill="none" stroke="#ef4444" stroke-width="6" transform="rotate(30 230 135)" filter="url(#shadow_rubber_bands)"/>
      <ellipse cx="200" cy="125" rx="45" ry="25" fill="none" stroke="#22c55e" stroke-width="5" filter="url(#shadow_rubber_bands)"/>
    
  <rect x="16" y="16" width="102" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#eab308" stroke-width="1.2"/>
  <text x="67.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#eab308" text-anchor="middle" letter-spacing="0.8">STATIONERY</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Elastic Rubber Bands Pack</text>
</svg>