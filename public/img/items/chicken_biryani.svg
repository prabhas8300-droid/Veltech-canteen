<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_chicken_biryani" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#271714"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_chicken_biryani" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_chicken_biryani)"/>
  
      <!-- Clay Handi Pot -->
      <path d="M 120,120 C 110,180 140,210 200,210 C 260,210 290,180 280,120 Z" fill="#9a3412" filter="url(#shadow_chicken_biryani)"/>
      <ellipse cx="200" cy="120" rx="80" ry="24" fill="#ea580c"/>
      <!-- Saffron Rice -->
      <ellipse cx="200" cy="118" rx="74" ry="20" fill="#f59e0b"/>
      <!-- Chicken Leg Piece -->
      <path d="M 160,115 C 170,95 210,100 220,115 C 215,125 175,125 160,115 Z" fill="#991b1b" filter="url(#shadow_chicken_biryani)"/>
      <rect x="215" y="105" width="25" height="8" rx="4" fill="#fef3c7" transform="rotate(20 215 105)"/>
      <!-- Boiled egg half -->
      <ellipse cx="180" cy="130" rx="16" ry="12" fill="#ffffff" filter="url(#shadow_chicken_biryani)"/>
      <circle cx="180" cy="130" r="7" fill="#f59e0b"/>
      <!-- Fried Onions -->
      <ellipse cx="205" cy="122" rx="9" ry="3" fill="#451a03"/>
      <ellipse cx="150" cy="120" rx="8" ry="2.5" fill="#451a03"/>
      <!-- Salan Bowl -->
      <circle cx="320" cy="165" r="24" fill="#374151" filter="url(#shadow_chicken_biryani)"/>
      <circle cx="320" cy="165" r="21" fill="#b91c1c"/>
    
  <rect x="16" y="16" width="142" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#ef4444" stroke-width="1.2"/>
  <text x="87.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="0.8">LUNCH • NON-VEG</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Hyderabadi Chicken Dum Biryani</text>
</svg>