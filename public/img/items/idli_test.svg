<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2826"/>
      <stop offset="100%" stop-color="#0b1311"/>
    </linearGradient>
    <linearGradient id="bananaLeaf" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="50%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <radialGradient id="idliShine" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e0e0d5"/>
    </radialGradient>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Plate / Table -->
  <rect width="400" height="260" fill="url(#bg)"/>
  
  <!-- Banana Leaf Cut -->
  <path d="M 40,130 C 50,60 120,40 220,45 C 330,50 370,100 360,170 C 350,225 280,235 180,230 C 90,225 35,190 40,130 Z" fill="url(#bananaLeaf)" filter="url(#drop)"/>
  <!-- Leaf veins -->
  <path d="M 50,135 Q 200,138 350,140" stroke="#4caf50" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 100,136 L 140,85 M 160,137 L 210,75 M 230,138 L 290,80" stroke="#4caf50" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 120,136 L 160,195 M 180,137 L 230,200 M 250,138 L 300,195" stroke="#4caf50" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Sambar Bowl -->
  <circle cx="110" cy="95" r="34" fill="#374151" filter="url(#drop)"/>
  <circle cx="110" cy="95" r="29" fill="#d97706"/>
  <circle cx="110" cy="95" r="26" fill="#f59e0b" opacity="0.8"/>
  <circle cx="114" cy="92" r="5" fill="#ef4444" opacity="0.9"/>
  <path d="M 105,88 Q 110,83 118,85" stroke="#15803d" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Coconut Chutney Bowl -->
  <circle cx="290" cy="95" r="32" fill="#374151" filter="url(#drop)"/>
  <circle cx="290" cy="95" r="27" fill="#f8fafc"/>
  <circle cx="288" cy="93" r="3" fill="#1e293b"/>
  <circle cx="294" cy="98" r="2.5" fill="#1e293b"/>
  <path d="M 285,90 Q 290,85 295,92" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Idli 1 (Left) -->
  <ellipse cx="160" cy="155" rx="50" ry="38" fill="url(#idliShine)" filter="url(#drop)"/>
  <ellipse cx="152" cy="148" rx="38" ry="26" fill="#ffffff" opacity="0.6"/>

  <!-- Idli 2 (Right, overlapping) -->
  <ellipse cx="235" cy="160" rx="52" ry="39" fill="url(#idliShine)" filter="url(#drop)"/>
  <ellipse cx="227" cy="152" rx="40" ry="27" fill="#ffffff" opacity="0.6"/>

  <!-- Garnish: Curry Leaves -->
  <path d="M 195,145 Q 200,135 208,138 Q 202,148 195,145 Z" fill="#15803d"/>
  <path d="M 203,142 Q 212,133 218,140 Q 210,147 203,142 Z" fill="#16a34a"/>

  <!-- Label Badge -->
  <rect x="16" y="16" width="92" height="24" rx="12" fill="rgba(0,0,0,0.65)"/>
  <text x="62" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">AUTHENTIC</text>
</svg>