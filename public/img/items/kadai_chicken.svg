<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_kadai_chicken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281716"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_kadai_chicken" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_kadai_chicken)"/>
  
      <!-- Iron Wok / Kadai -->
      <ellipse cx="200" cy="140" rx="110" ry="65" fill="#18181b" filter="url(#shadow_kadai_chicken)"/>
      <!-- Kadai Handles -->
      <path d="M 75,135 Q 60,135 60,120 Q 60,105 78,110" stroke="#52525b" stroke-width="6" fill="none"/>
      <path d="M 325,135 Q 340,135 340,120 Q 340,105 322,110" stroke="#52525b" stroke-width="6" fill="none"/>
      <!-- Rich Spicy Gravy -->
      <ellipse cx="200" cy="138" rx="98" ry="55" fill="#991b1b"/>
      <!-- Chicken Pieces -->
      <ellipse cx="170" cy="130" rx="22" ry="14" fill="#7f1d1d" filter="url(#shadow_kadai_chicken)"/>
      <ellipse cx="220" cy="135" rx="20" ry="13" fill="#7f1d1d" filter="url(#shadow_kadai_chicken)"/>
      <!-- Bell peppers (Capsicum green &amp; red) -->
      <rect x="155" y="145" width="14" height="8" rx="2" fill="#16a34a"/>
      <rect x="210" y="120" width="12" height="8" rx="2" fill="#16a34a"/>
      <rect x="190" y="138" width="12" height="8" rx="2" fill="#dc2626"/>
    
  <rect x="16" y="16" width="150" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#ef4444" stroke-width="1.2"/>
  <text x="91.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="0.8">DINNER • NON-VEG</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Kadai Chicken Curry</text>
</svg>