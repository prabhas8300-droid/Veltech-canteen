<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_scale_ruler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_scale_ruler" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_scale_ruler)"/>
  
      <!-- 3-Sided Architect Scale Ruler -->
      <polygon points="60,110 340,110 330,145 70,145" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow_scale_ruler)"/>
      <!-- Colored groove strips -->
      <line x1="60" y1="110" x2="340" y2="110" stroke="#dc2626" stroke-width="4"/>
      <line x1="70" y1="145" x2="330" y2="145" stroke="#2563eb" stroke-width="4"/>
      <text x="200" y="132" font-family="sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">ENGINEERING ARCHITECT SCALE 1:100 / 1:200</text>
    
  <rect x="16" y="16" width="70" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="51.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#8b5cf6" text-anchor="middle" letter-spacing="0.8">RULERS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Engineering Triangular Scale Ruler</text>
</svg>