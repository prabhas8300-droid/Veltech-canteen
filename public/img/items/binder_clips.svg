<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_binder_clips" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161d27"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_binder_clips" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_binder_clips)"/>
  
      <!-- Real Foldback Black Binder Clip -->
      <polygon points="170,120 230,120 240,165 160,165" fill="#0f172a" filter="url(#shadow_binder_clips)"/>
      <rect x="160" y="160" width="80" height="8" rx="2" fill="#1e293b"/>
      <!-- Silver Wire Arms -->
      <path d="M 175,120 L 175,80 Q 175,70 185,70 L 190,70" stroke="#cbd5e1" stroke-width="4.5" fill="none"/>
      <path d="M 225,120 L 225,80 Q 225,70 215,70 L 210,70" stroke="#cbd5e1" stroke-width="4.5" fill="none"/>
      <text x="200" y="195" font-family="sans-serif" font-size="9" font-weight="800" fill="#cbd5e1" text-anchor="middle">TEMPERED STEEL 32mm</text>
    
  <rect x="16" y="16" width="62" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="47.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0ea5e9" text-anchor="middle" letter-spacing="0.8">FILES</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Butterfly Binder Clips (Box of 12)</text>
</svg>