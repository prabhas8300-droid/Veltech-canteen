<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_samosa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241d14"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_samosa" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_samosa)"/>
  
      <ellipse cx="200" cy="155" rx="140" ry="65" fill="#27272a" filter="url(#shadow_samosa)"/>
      <!-- Samosa 1 (Left) -->
      <path d="M 130,75 L 70,175 L 190,175 Z" fill="#b45309" filter="url(#shadow_samosa)"/>
      <path d="M 130,82 L 78,170 L 182,170 Z" fill="#d97706"/>
      <path d="M 130,92 L 90,165 L 170,165 Z" fill="#f59e0b"/>
      <!-- Samosa 2 (Right) -->
      <path d="M 235,70 L 170,170 L 295,170 Z" fill="#b45309" filter="url(#shadow_samosa)"/>
      <path d="M 235,77 L 178,165 L 287,165 Z" fill="#d97706"/>
      <path d="M 235,87 L 190,160 L 275,160 Z" fill="#f59e0b"/>
      <!-- Mint Chutney Bowl -->
      <circle cx="310" cy="120" r="26" fill="#374151" filter="url(#shadow_samosa)"/>
      <circle cx="310" cy="120" r="22" fill="#15803d"/>
      <circle cx="312" cy="118" r="4" fill="#86efac" opacity="0.6"/>
      <!-- Fried Green Chili -->
      <path d="M 120,185 Q 160,180 200,188" stroke="#16a34a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    
  <rect x="16" y="16" width="118" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#22c55e" stroke-width="1.2"/>
  <text x="75.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="0.8">SNACKS • VEG</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Crispy Golden Samosas (2 pcs)</text>
</svg>