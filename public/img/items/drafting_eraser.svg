<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_drafting_eraser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171e27"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_drafting_eraser" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_drafting_eraser)"/>
  
      <!-- Sharp Beveled Technical Eraser -->
      <rect x="130" y="90" width="140" height="80" rx="3" fill="#f1f5f9" filter="url(#shadow_drafting_eraser)"/>
      <!-- Sleeve -->
      <rect x="175" y="90" width="95" height="80" fill="#1e293b"/>
      <text x="222" y="125" font-family="sans-serif" font-size="9" font-weight="900" fill="#38bdf8" text-anchor="middle">DRAFTING</text>
      <text x="222" y="142" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">NON-ABRASIVE</text>
    
  <rect x="16" y="16" width="78" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="55.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#14b8a6" text-anchor="middle" letter-spacing="0.8">ERASERS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Precision Drafting Vinyl Eraser</text>
</svg>