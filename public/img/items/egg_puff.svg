<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_egg_puff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261e15"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_egg_puff" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_egg_puff)"/>
  
      <ellipse cx="200" cy="155" rx="140" ry="60" fill="#27272a" filter="url(#shadow_egg_puff)"/>
      <!-- Flaky puff -->
      <path d="M 110,140 Q 200,70 290,140 Q 200,195 110,140 Z" fill="#b45309" filter="url(#shadow_egg_puff)"/>
      <path d="M 118,138 Q 200,80 282,138 Q 200,185 118,138 Z" fill="#d97706"/>
      <path d="M 128,136 Q 200,90 272,136 Q 200,175 128,136 Z" fill="#f59e0b"/>
      <!-- Boiled egg half clearly visible inside -->
      <ellipse cx="200" cy="136" rx="34" ry="24" fill="#ffffff" filter="url(#shadow_egg_puff)"/>
      <ellipse cx="200" cy="136" rx="18" ry="14" fill="#f59e0b"/>
      <ellipse cx="200" cy="136" rx="12" ry="9" fill="#eab308"/>
      <!-- Black Pepper dusting on egg -->
      <circle cx="196" cy="132" r="1.5" fill="#18181b"/>
      <circle cx="204" cy="138" r="1.5" fill="#18181b"/>
    
  <rect x="16" y="16" width="118" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="75.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.8">SNACKS • EGG</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Crispy Golden Egg Puff</text>
</svg>