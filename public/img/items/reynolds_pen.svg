<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_reynolds_pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e2b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_reynolds_pen" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_reynolds_pen)"/>
  
      <!-- White Pen Body -->
      <rect x="90" y="125" width="180" height="12" rx="3" fill="#ffffff" filter="url(#shadow_reynolds_pen)"/>
      <text x="180" y="134" font-family="sans-serif" font-size="7" font-weight="900" fill="#1d4ed8" text-anchor="middle">Reynolds 045 Fine Carbure</text>
      <!-- Blue Cap with Pocket Clip -->
      <rect x="250" y="122" width="60" height="18" rx="4" fill="#1d4ed8" filter="url(#shadow_reynolds_pen)"/>
      <rect x="255" y="116" width="45" height="4" rx="2" fill="#1e40af"/>
      <!-- Brass Ballpoint Tip -->
      <polygon points="90,126 90,136 72,131" fill="#eab308"/>
      <circle cx="71" cy="131" r="1.5" fill="#1e293b"/>
    
  <rect x="16" y="16" width="54" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="43.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#3b82f6" text-anchor="middle" letter-spacing="0.8">PENS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Reynolds 045 Ballpoint Pen (Blue)</text>
</svg>