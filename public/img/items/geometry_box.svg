<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_geometry_box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16202c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_geometry_box" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_geometry_box)"/>
  
      <!-- Tin Metal Geometry Box -->
      <rect x="90" y="70" width="220" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow_geometry_box)"/>
      <rect x="95" y="75" width="210" height="110" rx="6" fill="#0284c7"/>
      <text x="200" y="105" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MATHEMATICAL</text>
      <text x="200" y="125" font-family="sans-serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle">INSTRUMENTS BOX</text>
      <text x="200" y="155" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Compass • Divider • Protractor • Set Squares</text>
    
  <rect x="16" y="16" width="70" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="51.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#8b5cf6" text-anchor="middle" letter-spacing="0.8">RULERS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Mathematical Geometry Tin Box</text>
</svg>