<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_mechanical_pencil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c28"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_mechanical_pencil" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_mechanical_pencil)"/>
  
      <rect x="80" y="125" width="200" height="12" rx="3" fill="#1e293b" filter="url(#shadow_mechanical_pencil)"/>
      <!-- Metallic Grip Section -->
      <rect x="95" y="125" width="45" height="12" fill="#94a3b8"/>
      <!-- Lead pipe tip -->
      <rect x="80" y="129" width="15" height="4" fill="#cbd5e1"/>
      <line x1="72" y1="131" x2="80" y2="131" stroke="#0f172a" stroke-width="1.5"/>
      <!-- Label -->
      <text x="190" y="134" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#38bdf8">DRAFTING 0.5 mm</text>
      <!-- Metal Clip &amp; Eraser Cap -->
      <rect x="250" y="120" width="30" height="4" rx="1.5" fill="#94a3b8"/>
      <rect x="270" y="127" width="16" height="8" fill="#e2e8f0"/>
    
  <rect x="16" y="16" width="78" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#6366f1" stroke-width="1.2"/>
  <text x="55.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6366f1" text-anchor="middle" letter-spacing="0.8">PENCILS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Mechanical Drafting Pencil 0.5mm</text>
</svg>