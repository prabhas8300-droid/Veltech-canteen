<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_sketch_book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17222d"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_sketch_book" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_sketch_book)"/>
  
      <!-- Landscape A3 format pad -->
      <rect x="90" y="65" width="220" height="140" rx="6" fill="#334155" filter="url(#shadow_sketch_book)"/>
      <rect x="95" y="70" width="210" height="130" rx="4" fill="#f8fafc"/>
      <rect x="90" y="65" width="220" height="16" fill="#0284c7"/>
      <text x="200" y="120" font-family="sans-serif" font-size="14" font-weight="900" fill="#0284c7" text-anchor="middle">A3 SKETCH BOOK</text>
      <text x="200" y="140" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">140 GSM Cartridge Paper • Engineering Graphics</text>
      <!-- Pencil illustration lying across -->
      <rect x="140" y="160" width="110" height="8" rx="2" fill="#eab308" transform="rotate(-5 140 160)"/>
    
  <rect x="16" y="16" width="94" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#ec4899" stroke-width="1.2"/>
  <text x="63.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ec4899" text-anchor="middle" letter-spacing="0.8">NOTEBOOKS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">A3 Drawing &amp; Sketch Book</text>
</svg>