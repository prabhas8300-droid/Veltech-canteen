<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_ruled_longbook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27151c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_ruled_longbook" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_ruled_longbook)"/>
  
      <rect x="130" y="45" width="145" height="175" rx="6" fill="#be123c" filter="url(#shadow_ruled_longbook)"/>
      <rect x="135" y="50" width="135" height="165" rx="4" fill="#e11d48"/>
      <!-- Classmate Cover Graphic -->
      <rect x="150" y="70" width="105" height="50" rx="4" fill="#ffffff" filter="url(#shadow_ruled_longbook)"/>
      <text x="202" y="92" font-family="sans-serif" font-size="11" font-weight="900" fill="#be123c" text-anchor="middle">LONG BOOK</text>
      <text x="202" y="108" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">200 PAGES RULED</text>
      <text x="202" y="165" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">PREMIUM 70 GSM PAPER</text>
    
  <rect x="16" y="16" width="94" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#ec4899" stroke-width="1.2"/>
  <text x="63.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ec4899" text-anchor="middle" letter-spacing="0.8">NOTEBOOKS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">200-Page Ruled Long Notebook</text>
