<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_canister_sharpener" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e28"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_canister_sharpener" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_canister_sharpener)"/>
  
      <!-- Translucent Canister Body -->
      <rect x="145" y="70" width="110" height="120" rx="20" fill="#0284c7" opacity="0.65" filter="url(#shadow_canister_sharpener)"/>
      <!-- Inner Pencil Shavings -->
      <path d="M 155,140 Q 180,130 200,150 Q 230,135 245,150 L 245,180 L 155,180 Z" fill="#d97706" opacity="0.8"/>
      <!-- Top Cap with 2 Holes -->
      <rect x="140" y="65" width="120" height="30" rx="8" fill="#0369a1"/>
      <circle cx="180" cy="80" r="8" fill="#0f172a"/>
      <circle cx="215" cy="80" r="10" fill="#0f172a"/>
    
  <rect x="16" y="16" width="102" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="67.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#14b8a6" text-anchor="middle" letter-spacing="0.8">SHARPENERS</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Double-Hole Canister Sharpener</text>
</svg>