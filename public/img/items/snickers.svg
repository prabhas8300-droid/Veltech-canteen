<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_snickers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#271913"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_snickers" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_snickers)"/>
  
      <!-- Classic Brown Wrapper -->
      <rect x="110" y="75" width="180" height="115" rx="8" fill="#451a03" filter="url(#shadow_snickers)"/>
      <rect x="115" y="80" width="170" height="105" rx="6" fill="#78350f"/>
      <!-- White Brand Box with Blue Lettering -->
      <rect x="130" y="105" width="140" height="48" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
      <text x="200" y="142" font-family="Impact, sans-serif" font-size="28" font-weight="900" fill="#1d4ed8" text-anchor="middle" letter-spacing="1">SNICKERS</text>
      <!-- Roasted peanuts banner -->
      <text x="200" y="172" font-family="sans-serif" font-size="9" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">PEANUTS • CARAMEL • NOUGAT</text>
    
  <rect x="16" y="16" width="94" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#f97316" stroke-width="1.2"/>
  <text x="63.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="0.8">CHOCOLATE</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Snickers Peanut Chocolate Bar</text>
</svg>