<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_whitener_pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d29"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_whitener_pen" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_whitener_pen)"/>
  
      <rect x="170" y="80" width="60" height="120" rx="12" fill="#2563eb" filter="url(#shadow_whitener_pen)"/>
      <text x="200" y="130" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">CORRECTION</text>
      <text x="200" y="145" font-family="sans-serif" font-size="8" font-weight="800" fill="#93c5fd" text-anchor="middle">PEN FLUID</text>
      <!-- Cap &amp; Fine Needle Tip -->
      <rect x="185" y="55" width="30" height="25" rx="4" fill="#ffffff" filter="url(#shadow_whitener_pen)"/>
      <line x1="200" y1="40" x2="200" y2="55" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="200" cy="40" r="1.5" fill="#ffffff"/>
    
  <rect x="16" y="16" width="102" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#eab308" stroke-width="1.2"/>
  <text x="67.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#eab308" text-anchor="middle" letter-spacing="0.8">STATIONERY</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Correction Pen Fluid (Whited Out)</text>
</svg>