<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_paneer_butter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#271c14"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_paneer_butter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_paneer_butter)"/>
  
      <circle cx="200" cy="135" r="85" fill="#3f3f46" filter="url(#shadow_paneer_butter)"/>
      <circle cx="200" cy="135" r="78" fill="#52525b"/>
      <!-- Rich Orange Gravy -->
      <circle cx="200" cy="135" r="72" fill="#ea580c"/>
      <circle cx="200" cy="135" r="62" fill="#f97316"/>
      <!-- Cream Swirl -->
      <path d="M 170,120 Q 200,105 220,130 Q 200,155 180,140" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
      <!-- Fresh Paneer Cubes -->
      <rect x="155" y="125" width="22" height="18" rx="2" fill="#ffffff" filter="url(#shadow_paneer_butter)"/>
      <rect x="185" y="110" width="24" height="20" rx="2" fill="#ffffff" filter="url(#shadow_paneer_butter)"/>
      <rect x="210" y="132" width="22" height="18" rx="2" fill="#ffffff" filter="url(#shadow_paneer_butter)"/>
      <rect x="180" y="145" width="20" height="16" rx="2" fill="#ffffff" filter="url(#shadow_paneer_butter)"/>
      <!-- Coriander garnish -->
      <circle cx="198" cy="128" r="3" fill="#15803d"/>
    
  <rect x="16" y="16" width="118" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#22c55e" stroke-width="1.2"/>
  <text x="75.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="0.8">DINNER • VEG</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Paneer Butter Masala</text>
</svg>