<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg_five_star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262013"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow_five_star" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="260" fill="url(#bg_five_star)"/>
  
      <!-- Golden Wrapped Bar -->
      <rect x="115" y="75" width="170" height="115" rx="10" fill="#ca8a04" filter="url(#shadow_five_star)"/>
      <rect x="120" y="80" width="160" height="105" rx="8" fill="#eab308"/>
      <!-- Cadbury Script -->
      <text x="200" y="105" font-family="'Brush Script MT', cursive, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Cadbury</text>
      <!-- 5 STAR Bold Red &amp; Black Shadow -->
      <text x="200" y="145" font-family="Impact, sans-serif" font-size="36" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="1">5 STAR</text>
      <!-- 5 Golden Stars -->
      <text x="200" y="168" font-size="14" fill="#ffffff" text-anchor="middle">★ ★ ★ ★ ★</text>
    
  <rect x="16" y="16" width="94" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="#eab308" stroke-width="1.2"/>
  <text x="63.0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#eab308" text-anchor="middle" letter-spacing="0.8">CHOCOLATE</text>
  <text x="200" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Cadbury 5 Star (Caramel Nougat)</text>
</svg>